name: CI and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each environment has its own ECR repository and EKS cluster, created by
# Terraform as <project>-<environment> and <project>-<environment>-eks.
# Pushes to develop deploy to dev and pushes to main to prod.
env:
  AWS_REGION: us-west-2
  GOLANGCI_LINT_VERSION: v2.12.2
  GOSEC_VERSION: v2.29.0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Runs the repository integration tests; without the database URL they
    # are skipped and the unit tests still pass.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: healthhub
          POSTGRES_PASSWORD: healthhub
          POSTGRES_DB: healthhub_test
        options: >-
          --health-cmd "pg_isready -U healthhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          HEALTHHUB_TEST_DATABASE_URL: postgres://healthhub:healthhub@localhost:5432/healthhub_test?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  gosec:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Writes SARIF for code scanning and a text report to the log, and
      # fails the job when gosec reports an issue.
      - name: Run gosec
        run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          -fmt sarif -out gosec.sarif -stdout -verbose text ./...

      - name: Upload SARIF
        # Pull requests from forks get a read-only token.
        if: always() && hashFiles('gosec.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [test, lint, gosec]
    # Runs on pull requests too, so every PR exercises the image build. The
    # ECR push path is used only on pushes when the ENABLE_AWS_DEPLOY
    # repository variable is 'true'; otherwise the image is built and
    # scanned locally without any AWS credentials.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    env:
      AWS_PUSH: ${{ vars.ENABLE_AWS_DEPLOY == 'true' && github.event_name == 'push' }}
      LOCAL_IMAGE: healthhub:ci-${{ github.sha }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      repository: ${{ steps.target.outputs.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Select target environment
        id: target
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "repository=healthhub-prod" >> "$GITHUB_OUTPUT"
          else
            echo "repository=healthhub-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: env.AWS_PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.AWS_PUSH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image metadata
        if: env.AWS_PUSH == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ steps.target.outputs.repository }}
          # The repositories have immutable tags, so every run pushes a tag
          # of its own; re-runs get a new one. Deployments use the digest.
          tags: |
            type=sha,format=long,suffix=-${{ github.run_attempt }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: env.AWS_PUSH == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

      - name: Build local image
        if: env.AWS_PUSH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

      - name: Scan image with Trivy
        if: env.AWS_PUSH == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ steps.target.outputs.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif

      - name: Scan local image with Trivy
        if: env.AWS_PUSH != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        # Pull requests from forks get a read-only token.
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  deploy-dev:
    name: Deploy (development)
    runs-on: ubuntu-latest
    needs: build
    # Off unless the ENABLE_AWS_DEPLOY repository variable is 'true'.
    if: vars.ENABLE_AWS_DEPLOY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name healthhub-dev-eks

      # Deploy by digest so the rollout runs exactly the image that was
      # built and scanned above.
      - name: Deploy
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ needs.build.outputs.repository }}@${{ needs.build.outputs.digest }}
        working-directory: deployments/k8s
        run: |
          kustomize edit set image healthcare-api="$IMAGE"
          kubectl apply -k .
          kubectl rollout status deployment/healthcare-api -n healthcare-api --timeout=300s

      - name: Smoke test
        run: |
          kubectl run smoke-test --rm -i --restart=Never -n healthcare-api \
            --image=curlimages/curl:8.23.0 -- \
            curl -fsS http://healthcare-api-service/health/ready

  deploy-prod:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: build
    # Off unless the ENABLE_AWS_DEPLOY repository variable is 'true'.
    if: vars.ENABLE_AWS_DEPLOY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name healthhub-prod-eks

      - name: Deploy
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ needs.build.outputs.repository }}@${{ needs.build.outputs.digest }}
        working-directory: deployments/k8s
        run: |
          kustomize edit set image healthcare-api="$IMAGE"
          kubectl apply -k .
          kubectl rollout status deployment/healthcare-api -n healthcare-api --timeout=600s

      - name: Smoke test
        run: |
          kubectl run smoke-test --rm -i --restart=Never -n healthcare-api \
            --image=curlimages/curl:8.23.0 -- \
            curl -fsS http://healthcare-api-service/health/ready

      - name: Notify Slack
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "Production deploy of ${{ github.sha }}: ${{ job.status }}"
