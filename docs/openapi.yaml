openapi: 3.0.3
info:
  title: Healthcare API
  description: |
    A comprehensive healthcare-focused RESTful API that allows for creating, reading, updating, and deleting patient records, including demographics and lab results.
    
    This API follows FHIR R4 standards and provides secure access to healthcare data with role-based access control, encryption, and audit logging.
    
    ## Features
    - FHIR R4 compliant data models
    - JWT-based authentication
    - Role-based access control (RBAC)
    - AES-256 encryption for sensitive data
    - Comprehensive audit logging
    - Health check endpoints for monitoring
    
    ## Security
    All endpoints (except authentication and health checks) require a valid JWT token in the Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```
    
    ## Rate Limiting
    Requests are rate limited per client IP: 300 per minute for the API
    (RATE_LIMIT_RPM) and 10 per minute for login, registration and password
    changes (AUTH_RATE_LIMIT_RPM). Limited requests get 429.

    ## Errors
    Errors are RFC 9457 problem details (application/problem+json) with a
    stable `code`, the `requestId`, and per-field `errors` for validation
    failures. Health probes are served at the server root, not under /api/v1.
    
    ## Data Compliance
    This API is designed with healthcare data compliance in mind:
    - All data is encrypted at rest and in transit
    - Audit logs are maintained for all data access
    - User access is controlled via RBAC
    - PHI data is handled according to HIPAA guidelines
    
  version: 1.0.0
  contact:
    name: Healthcare API Support
    email: support@healthcareapi.com
    url: https://docs.healthcareapi.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.healthcareapi.com/api/v1
    description: Production server
  - url: https://api-staging.healthcareapi.com/api/v1
    description: Staging server
  - url: http://localhost:8080/api/v1
    description: Development server

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Patients
    description: Patient management operations
  - name: Observations
    description: Clinical observation and lab result management
  - name: Users
    description: Account administration (admin role)
  - name: Audit
    description: Audit trail of access to records (admin role)
  - name: Health
    description: Health probes, served at the server root

paths:
  # Authentication Endpoints
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Sign in
      description: Authenticate with email and password and receive an access token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  maxLength: 1024
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Self-registration
      description: |
        Create an account with no roles. Disabled unless the server runs with
        ALLOW_REGISTRATION=true; an administrator must then grant roles.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 72
                firstName:
                  type: string
                  maxLength: 100
                lastName:
                  type: string
                  maxLength: 100
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Self-registration is disabled (code registration_disabled)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh the access token
      description: |
        Exchange a valid access token for a new one. The account is re-read, so
        role changes and deactivation take effect. There is no request body.
      operationId: refreshToken
      security:
        - BearerAuth: []
      responses:
        '200':
          description: New token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Current user
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The signed-in user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                  maxLength: 1024
                newPassword:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 72
                  description: 12 to 72 characters and at most 72 bytes (bcrypt limit).
      responses:
        '204':
          description: Password changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # Patient Endpoints
  /patients:
    get:
      tags:
        - Patients
      summary: Get patients
      description: Retrieve a list of patients with optional filtering and pagination
      operationId: getPatients
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: family
          in: query
          description: Family name, exact match ignoring case and spacing. There is no free-text search; names are stored encrypted.
          schema:
            type: string
        - name: birthdate
          in: query
          schema:
            type: string
            format: date
        - name: telecom
          in: query
          description: Phone number or email address, exact match
          schema:
            type: string
        - name: gender
          in: query
          schema:
            type: string
            enum: [male, female, other, unknown]
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Patients retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Patients
      summary: Create patient
      description: Create a new patient record
      operationId: createPatient
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
      responses:
        '201':
          description: Patient created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /patients/{id}:
    get:
      tags:
        - Patients
      summary: Get patient by ID
      description: Retrieve a specific patient by their ID
      operationId: getPatient
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - Patients
      summary: Update patient
      description: Update an existing patient record
      operationId: updatePatient
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdate'
      responses:
        '200':
          description: Patient updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Patients
      summary: Delete patient
      description: Delete a patient record (soft delete - archives the record)
      operationId: deletePatient
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Patient ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Patient deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # Observation Endpoints
  /observations:
    get:
      tags:
        - Observations
      summary: Get observations
      description: Retrieve a list of clinical observations with optional filtering and pagination
      operationId: getObservations
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: patient
          in: query
          description: Patient ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ObservationCode'
        - $ref: '#/components/parameters/ObservationCategory'
        - $ref: '#/components/parameters/ObservationStatus'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Observations retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Observation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Observations
      summary: Create observation
      description: Create a new clinical observation record
      operationId: createObservation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationCreate'
      responses:
        '201':
          description: Observation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /observations/{id}:
    get:
      tags:
        - Observations
      summary: Get observation by ID
      description: Retrieve a specific observation by its ID
      operationId: getObservation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Observation ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Observation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - Observations
      summary: Update observation
      description: Update an existing observation record
      operationId: updateObservation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Observation ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationUpdate'
      responses:
        '200':
          description: Observation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Observations
      summary: Delete observation
      description: Delete an observation record (soft delete - archives the record)
      operationId: deleteObservation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Observation ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Observation deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /patients/{id}/observations:
    get:
      tags:
        - Observations
      summary: Get a patient's observations
      description: Same filters and paging as GET /observations, scoped to one patient. Newest first.
      operationId: getPatientObservations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ObservationStatus'
        - $ref: '#/components/parameters/ObservationCategory'
        - $ref: '#/components/parameters/ObservationCode'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: One page of observations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Observation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Administration (admin role)
  /users:
    get:
      tags:
        - Users
      summary: List accounts
      description: Accounts sorted by email. Admin only.
      operationId: getUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Users
      summary: Create an account
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 72
                firstName:
                  type: string
                  maxLength: 100
                lastName:
                  type: string
                  maxLength: 100
                roles:
                  type: array
                  maxItems: 4
                  items:
                    $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Users
      summary: Get an account
      operationId: getUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Users
      summary: Change roles or active status
      description: |
        Set roles, active, or both. Changes apply to new tokens. A change that
        would leave no active administrator is refused with 409.
      operationId: updateUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                roles:
                  type: array
                  maxItems: 4
                  items:
                    $ref: '#/components/schemas/Role'
                active:
                  type: boolean
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /audit-events:
    get:
      tags:
        - Audit
      summary: Audit trail
      description: Who accessed or changed which records, newest first. Holds record IDs, never PHI. Admin only.
      operationId: getAuditEvents
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: actor
          in: query
          description: User ID of the actor
          schema:
            type: string
            format: uuid
        - name: resource
          in: query
          description: ID of an affected record
          schema:
            type: string
            format: uuid
        - name: resourceType
          in: query
          schema:
            type: string
            enum: [patient, observation, user]
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: One page of audit events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # Health probes are served at the server root, not under /api/v1.
  /health:
    servers:
      - url: http://localhost:8080
        description: Health probes live at the root
    get:
      tags:
        - Health
      summary: Readiness check (alias of /health/ready)
      operationId: healthCheck
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /health/ready:
    servers:
      - url: http://localhost:8080
        description: Health probes live at the root
    get:
      tags:
        - Health
      summary: Readiness check
      description: Checks that the database is reachable.
      operationId: readinessCheck
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /health/live:
    servers:
      - url: http://localhost:8080
        description: Health probes live at the root
    get:
      tags:
        - Health
      summary: Liveness check
      description: Reports that the process is serving requests; never touches dependencies.
      operationId: livenessCheck
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Page size. The server default is 20 and the maximum 100 (DEFAULT_PAGE_SIZE, MAX_PAGE_SIZE).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ObservationStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [registered, preliminary, final, amended, corrected, cancelled, entered-in-error, unknown]
    ObservationCategory:
      name: category
      in: query
      description: Category code such as laboratory or vital-signs
      schema:
        type: string
    ObservationCode:
      name: code
      in: query
      description: Exact code, either bare (8867-4) or system|code
      schema:
        type: string
    From:
      name: from
      in: query
      description: RFC 3339 timestamp or YYYY-MM-DD (start of that day, UTC)
      schema:
        type: string
    To:
      name: to
      in: query
      description: RFC 3339 timestamp or YYYY-MM-DD (end of that day, UTC)
      schema:
        type: string

  schemas:
    Role:
      type: string
      enum: [admin, practitioner, nurse, lab-tech]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        active:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Bearer access token (JWT). Valid for JWT_TTL, one hour by default.
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
        action:
          type: string
          enum: [create, read, list, update, delete]
        resourceType:
          type: string
          enum: [patient, observation, user]
        resourceIds:
          type: array
          items:
            type: string
        requestId:
          type: string
        clientIp:
          type: string

    Page:
      type: object
      properties:
        data:
          type: array
          items: {}
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Problem:
      type: object
      description: RFC 9457 problem details, served as application/problem+json.
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine readable error code
          example: validation_failed
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: name[0].family
              message:
                type: string
                example: is required

    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Patient ID
        active:
          type: boolean
          description: Whether the patient record is active
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          description: Patient identifiers (MRN, SSN, etc.)
        name:
          type: array
          items:
            $ref: '#/components/schemas/HumanName'
          description: Patient names
        telecom:
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'
          description: Contact information
        gender:
          type: string
          enum: [male, female, other, unknown]
          description: Patient gender
        birth_date:
          type: string
          format: date
          description: Patient birth date
        deceased_boolean:
          type: boolean
          description: Whether the patient is deceased
        address:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          description: Patient addresses
        marital_status:
          $ref: '#/components/schemas/CodeableConcept'
        contact:
          type: array
          items:
            $ref: '#/components/schemas/PatientContact'
          description: Emergency contacts
        communication:
          type: array
          items:
            $ref: '#/components/schemas/PatientCommunication'
          description: Language preferences
        managing_organization:
          $ref: '#/components/schemas/Reference'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PatientCreate:
      type: object
      required:
        - name
        - gender
      properties:
        active:
          type: boolean
          default: true
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        name:
          type: array
          items:
            $ref: '#/components/schemas/HumanName'
          minItems: 1
        telecom:
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'
        gender:
          type: string
          enum: [male, female, other, unknown]
        birth_date:
          type: string
          format: date
        address:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        marital_status:
          $ref: '#/components/schemas/CodeableConcept'
        contact:
          type: array
          items:
            $ref: '#/components/schemas/PatientContact'

    PatientUpdate:
      type: object
      properties:
        active:
          type: boolean
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        name:
          type: array
          items:
            $ref: '#/components/schemas/HumanName'
        telecom:
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'
        gender:
          type: string
          enum: [male, female, other, unknown]
        birth_date:
          type: string
          format: date
        address:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        marital_status:
          $ref: '#/components/schemas/CodeableConcept'
        contact:
          type: array
          items:
            $ref: '#/components/schemas/PatientContact'

    Observation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Observation ID
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          description: Observation identifiers
        status:
          type: string
          enum: [registered, preliminary, final, amended, corrected, cancelled, entered-in-error, unknown]
          description: Observation status
        category:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
          description: Observation categories
        code:
          $ref: '#/components/schemas/CodeableConcept'
        subject:
          $ref: '#/components/schemas/Reference'
        encounter:
          $ref: '#/components/schemas/Reference'
        effective_date_time:
          type: string
          format: date-time
          description: When observation was taken
        issued:
          type: string
          format: date-time
          description: When observation was published
        performer:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
          description: Who performed the observation
        value_quantity:
          $ref: '#/components/schemas/Quantity'
        value_string:
          type: string
          description: Observation value as string
        value_boolean:
          type: boolean
          description: Observation value as boolean
        interpretation:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
          description: High, low, normal, etc.
        note:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          description: Comments about the observation
        reference_range:
          type: array
          items:
            $ref: '#/components/schemas/ObservationReferenceRange'
          description: Normal range for the observation
        component:
          type: array
          items:
            $ref: '#/components/schemas/ObservationComponent'
          description: Component observations
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ObservationCreate:
      type: object
      required:
        - status
        - code
        - subject
      properties:
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum: [registered, preliminary, final, amended, corrected, cancelled, entered-in-error, unknown]
        category:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        code:
          $ref: '#/components/schemas/CodeableConcept'
        subject:
          $ref: '#/components/schemas/Reference'
        encounter:
          $ref: '#/components/schemas/Reference'
        effective_date_time:
          type: string
          format: date-time
        performer:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        value_quantity:
          $ref: '#/components/schemas/Quantity'
        value_string:
          type: string
        value_boolean:
          type: boolean
        interpretation:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        note:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        reference_range:
          type: array
          items:
            $ref: '#/components/schemas/ObservationReferenceRange'
        component:
          type: array
          items:
            $ref: '#/components/schemas/ObservationComponent'

    ObservationUpdate:
      type: object
      properties:
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum: [registered, preliminary, final, amended, corrected, cancelled, entered-in-error, unknown]
        category:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        code:
          $ref: '#/components/schemas/CodeableConcept'
        effective_date_time:
          type: string
          format: date-time
        performer:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        value_quantity:
          $ref: '#/components/schemas/Quantity'
        value_string:
          type: string
        value_boolean:
          type: boolean
        interpretation:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        note:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        reference_range:
          type: array
          items:
            $ref: '#/components/schemas/ObservationReferenceRange'
        component:
          type: array
          items:
            $ref: '#/components/schemas/ObservationComponent'

    # Common FHIR Data Types
    HumanName:
      type: object
      properties:
        use:
          type: string
          enum: [usual, official, temp, nickname, anonymous, old, maiden]
        text:
          type: string
          description: Text representation of the full name
        family:
          type: string
          description: Family name (surname)
        given:
          type: array
          items:
            type: string
          description: Given names (first, middle names)
        prefix:
          type: array
          items:
            type: string
          description: Name prefixes (Mr., Dr., etc.)
        suffix:
          type: array
          items:
            type: string
          description: Name suffixes (Jr., Sr., etc.)

    ContactPoint:
      type: object
      properties:
        system:
          type: string
          enum: [phone, fax, email, pager, url, sms, other]
        value:
          type: string
          description: The actual contact point
        use:
          type: string
          enum: [home, work, temp, old, mobile]
        rank:
          type: integer
          description: Preference order (1 = highest)

    Address:
      type: object
      properties:
        use:
          type: string
          enum: [home, work, temp, old, billing]
        type:
          type: string
          enum: [postal, physical, both]
        text:
          type: string
          description: Text representation of the address
        line:
          type: array
          items:
            type: string
          description: Street address lines
        city:
          type: string
          description: City name
        district:
          type: string
          description: District/county
        state:
          type: string
          description: State/province
        postal_code:
          type: string
          description: Postal/ZIP code
        country:
          type: string
          description: Country

    Identifier:
      type: object
      properties:
        use:
          type: string
          enum: [usual, official, temp, secondary, old]
        type:
          $ref: '#/components/schemas/CodeableConcept'
        system:
          type: string
          description: The namespace for the identifier
        value:
          type: string
          description: The value of the identifier

    CodeableConcept:
      type: object
      properties:
        coding:
          type: array
          items:
            $ref: '#/components/schemas/Coding'
          description: Code defined by a terminology system
        text:
          type: string
          description: Plain text representation

    Coding:
      type: object
      properties:
        system:
          type: string
          description: Identity of the terminology system
        version:
          type: string
          description: Version of the system
        code:
          type: string
          description: Symbol in syntax defined by the system
        display:
          type: string
          description: Representation defined by the system

    Reference:
      type: object
      properties:
        reference:
          type: string
          description: Literal reference, relative, internal or absolute URL
        type:
          type: string
          description: Type the reference refers to
        identifier:
          $ref: '#/components/schemas/Identifier'
        display:
          type: string
          description: Text alternative for the resource

    Quantity:
      type: object
      properties:
        value:
          type: number
          description: Numerical value
        comparator:
          type: string
          enum: ['<', '<=', '>=', '>']
          description: How to compare the value
        unit:
          type: string
          description: Unit representation
        system:
          type: string
          description: System that defines coded unit form
        code:
          type: string
          description: Coded form of the unit

    Annotation:
      type: object
      properties:
        author_reference:
          $ref: '#/components/schemas/Reference'
        author_string:
          type: string
        time:
          type: string
          format: date-time
        text:
          type: string
          description: The annotation text

    PatientContact:
      type: object
      properties:
        relationship:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
          description: The kind of relationship
        name:
          $ref: '#/components/schemas/HumanName'
        telecom:
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'
        address:
          $ref: '#/components/schemas/Address'
        gender:
          type: string
          enum: [male, female, other, unknown]
        organization:
          $ref: '#/components/schemas/Reference'

    PatientCommunication:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/CodeableConcept'
        preferred:
          type: boolean
          description: Language preference indicator

    ObservationReferenceRange:
      type: object
      properties:
        low:
          $ref: '#/components/schemas/Quantity'
        high:
          $ref: '#/components/schemas/Quantity'
        type:
          $ref: '#/components/schemas/CodeableConcept'
        applies_to:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        age:
          $ref: '#/components/schemas/Range'
        text:
          type: string

    ObservationComponent:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CodeableConcept'
        value_quantity:
          $ref: '#/components/schemas/Quantity'
        value_string:
          type: string
        value_boolean:
          type: boolean
        interpretation:
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        reference_range:
          type: array
          items:
            $ref: '#/components/schemas/ObservationReferenceRange'

    Range:
      type: object
      properties:
        low:
          $ref: '#/components/schemas/Quantity'
        high:
          $ref: '#/components/schemas/Quantity'

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not ready, alive]
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [up, down]

  responses:
    BadRequest:
      description: Malformed request or query parameters (code invalid_request)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ValidationFailed:
      description: One or more fields are invalid (code validation_failed)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Entity
            status: 422
            detail: One or more fields are invalid.
            instance: /api/v1/patients
            code: validation_failed
            requestId: 6f1c2f9e-6a3e-4f0e-9b8a-2d2f3f0c1a11
            errors:
              - field: name[0].family
                message: is required

    Unauthorized:
      description: Missing, invalid or expired token, or wrong credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: The caller's roles do not allow this action (code forbidden)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Resource not found (code not_found)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: Conflicts with an existing record or state (code conflict)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: Rate limited (code rate_limited)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalServerError:
      description: Unexpected server error (code internal_error); quote the requestId
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
