# Local development stack: the API and PostgreSQL.
#
#   docker compose -f deployments/docker/docker-compose.yml up --build
#
# The secrets below are development-only defaults; the server refuses them
# in any other ENVIRONMENT. Override them through the environment or an
# .env file next to this one. The database is reachable only from the API
# container; nothing but the API port is published, and only on localhost.
services:
  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://healthhub:${POSTGRES_PASSWORD:-healthhub-dev}@db:5432/healthhub?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-do-not-use-in-production-0123456789}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-32-byte-encryption-key-change-this-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthhub", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: healthhub
      POSTGRES_USER: healthhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthhub-dev}
    volumes:
      # PostgreSQL 18 images keep their data in a versioned directory below
      # /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthhub -d healthhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
