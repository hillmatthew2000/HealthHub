apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace and the Secret are deliberately not listed. Terraform
# creates both (deployments/terraform/aws/kubernetes.tf); on other clusters
# create them by hand (see README.md). Either way, applying these manifests
# never overwrites real credentials with placeholders.
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml

images:
  - name: healthcare-api
    newName: your-registry/healthhub
    newTag: replace-me
