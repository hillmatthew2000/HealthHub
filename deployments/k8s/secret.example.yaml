# Example only. This file is not listed in kustomization.yaml, so
# `kubectl apply -k deployments/k8s` never overwrites the real Secret.
# Create the Secret out of band, for example:
#
#   kubectl create secret generic healthcare-api-secrets -n healthcare-api \
#     --from-literal=DATABASE_URL='postgres://USER:PASSWORD@HOST:5432/healthhub?sslmode=require' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=REDIS_URL='redis://HOST:6379'
#
# or manage it with External Secrets / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: healthcare-api-secrets
  namespace: healthcare-api
  labels:
    app: healthcare-api
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/healthhub?sslmode=require"
  JWT_SECRET: "REPLACE_WITH_openssl_rand_-base64_48"
  ENCRYPTION_KEY: "REPLACE_WITH_openssl_rand_-base64_32"
  REDIS_URL: "redis://HOST:6379"
