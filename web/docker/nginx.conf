# nginx configuration for the HealthHub web app. It runs as the unprivileged
# nginx user, so the pid file and temp paths live in /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log the path without the query string: app URLs can carry search terms
    # such as a family name, which is PHI.
    log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # Written at start-up by /docker-entrypoint.d/40-healthhub-config.sh
        # from API_BASE_URL, so one image serves every environment.
        location = /config.js {
            alias /tmp/healthhub/config.js;
            default_type application/javascript;
            include /tmp/healthhub/headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Hashed build output never changes, so it can be cached for a year.
        location /assets/ {
            include /tmp/healthhub/headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Single page app: unknown paths serve index.html so client-side
        # routes survive a reload. index.html itself is always revalidated.
        location / {
            include /tmp/healthhub/headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
